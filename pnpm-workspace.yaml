packages:
  - apps/*
  - packages/*
  # Code generators that need the TypeScript JS API (TS 7 is native and has
  # none) live in isolated packages with their own TypeScript 5.9.
  - tools/openapi-gen

# Supply-chain hygiene: refuse packages published less than a day ago
# (most malicious releases are pulled within hours) and only run install
# scripts for packages that need them.
allowBuilds:
  esbuild: true
  msw: true
minimumReleaseAge: 1440

# Transitive dependency pins for known vulnerabilities (OSV), until the
# parent package bumps its own constraint. Verified compatible via `make check`.
overrides:
  js-yaml@<4.3.2: ">=4.3.2" # GHSA-2883-xcg3-v3hh, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
