name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local # mise installs the exact Go from mise.toml
  FORCE_COLOR: "1"

jobs:
  go:
    name: Go · lint, unit (race), vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: go mod verify
      - name: golangci-lint (architecture boundaries, security, style)
        run: go tool -modfile=tools/go.mod golangci-lint run ./...
      - name: Unit tests with the race detector
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...

  integration:
    name: Go · integration (PostgreSQL 18 via testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-int-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-int-${{ runner.os }}-
      - name: Integration tests (RLS, roles, transactions, migrations)
        run: go test -tags integration -race -count=1 ./...

  web:
    name: Web · lint, typecheck, unit, stories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
          key: web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: web-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm -r typecheck
      - run: pnpm --filter @opsgrid/web exec playwright install --with-deps chromium
      - name: Unit and component tests (browser)
        run: pnpm -r test
      - name: Storybook interaction and accessibility tests
        run: pnpm --filter @opsgrid/web test:stories
      - name: Production build (bundle budget check)
        run: pnpm --filter @opsgrid/web build

  contract:
    name: API contract · lint, generated code, breaking changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: pnpm install --frozen-lockfile
      - name: Redocly lint
        run: pnpm exec redocly lint api/openapi.yaml
      - name: Generated code matches the contract
        run: make check-generated
      - name: No unflagged breaking changes (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null || exit 0
          docker run --rm -v /tmp:/base:ro -v "$PWD/api:/head:ro" tufin/oasdiff:v1.33.0 \
            breaking /base/base-openapi.yaml /head/openapi.yaml --fail-on ERR

  migrations:
    name: Migrations · squawk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: pnpm install --frozen-lockfile
      - run: make lint-sql

  security:
    name: Security · secrets, dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose
      - name: OSV-Scanner (Go and pnpm lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=go.mod
            --lockfile=tools/go.mod
            --lockfile=pnpm-lock.yaml

  image:
    name: Image · build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: opsgrid:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsgrid:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  e2e:
    name: E2E · full stack (Compose + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsgrid/web exec playwright install --with-deps chromium
      - name: Boot the stack (one documented command)
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: make dev
      - name: Playwright
        env:
          CI: "true"
        run: make test-e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            compose-logs.txt
          retention-days: 7

  # Single required status check for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [go, integration, web, contract, migrations, security, image, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed: $RESULTS"; exit 1; fi
          done
