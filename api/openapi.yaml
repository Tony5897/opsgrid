openapi: 3.1.1
info:
  title: OpsGrid API
  version: 0.1.0
  summary: Multi-tenant, real-time field operations.
  description: |
    Contract-first HTTP API for OpsGrid (ADR-011). Generated code:
    Go strict-server interfaces (`internal/api/gen`) and TypeScript types and
    Zod schemas (`packages/api-client/src/gen`). Do not edit generated files;
    change this document and run `make generate`.

    Conventions
    - Errors are RFC 9457 problem documents (`application/problem+json`) with a
      stable `code` (ADR-012).
    - Unsafe requests require `X-OpsGrid-CSRF: 1` (ADR-019).
    - POST commands require `Idempotency-Key`; updates require `If-Match`.
    - Every response carries `X-Request-Id` (`req_` + ULID); quote it when
      reporting problems. It also appears as `requestId` in problem bodies.
    - Authentication is a BFF session cookie (`__Host-opsgrid_session`). The SPA
      never sees IdP tokens (ADR-006).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same origin as the web app (ADR-020)
tags:
  - name: meta
    description: Service information
  - name: identity
    description: Authenticated caller identity and memberships
  - name: tenancy
    description: Organizations and membership resolution
security:
  - sessionCookie: []
paths:
  /v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Service build information
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Current user, memberships and permissions
      description: |
        Returns the authenticated user and every active organization membership,
        with permissions expanded from the static role map. Hydrates org name/slug
        under per-org tenant transactions (ADR-004).
      responses:
        "200":
          description: Caller profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [tenancy]
      summary: Organization summary for an active member
      description: |
        Returns the organization when the caller holds an active membership.
        Non-members and unknown ids receive 404 TENANT_NOT_FOUND (no existence leak).
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization the caller may access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-opsgrid_session
      description: |
        Opaque BFF session secret (HttpOnly, Secure, SameSite=Lax, __Host- prefix).
        Set by `/auth/callback`; cleared by `/auth/logout`.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization UUID (not the URL slug used by the SPA).
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [service, version, commit]
      properties:
        service: { type: string, const: opsgrid }
        version: { type: string, examples: ["v1.0.0", "dev"] }
        commit: { type: string, description: Abbreviated git commit of the build. }
    Me:
      type: object
      additionalProperties: false
      required: [user, memberships]
      properties:
        user: { $ref: "#/components/schemas/MeUser" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/MeMembership" }
    MeUser:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, "null"]
          format: email
        displayName: { type: string }
    MeMembership:
      type: object
      additionalProperties: false
      required: [organizationId, slug, name, role, permissions]
      properties:
        organizationId: { type: string, format: uuid }
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 63
        name: { type: string }
        role: { $ref: "#/components/schemas/MembershipRole" }
        permissions:
          type: array
          items: { type: string }
          description: Expanded permission strings for this membership's role.
    Organization:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 63
        name: { type: string }
    MembershipRole:
      type: string
      enum: [owner, admin, dispatcher, technician, viewer]
    ProblemCode:
      type: string
      description: Stable, machine-readable error identifier (never renamed).
      enum:
        - AUTHENTICATION_REQUIRED
        - FORBIDDEN
        - TENANT_NOT_FOUND
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
        - PRECONDITION_REQUIRED
        - VERSION_CONFLICT
        - SCHEDULE_CONFLICT
        - INVALID_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - REQUEST_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details with OpsGrid extension members.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: "#/components/schemas/ProblemCode" }
        requestId: { type: string }
        traceId: { type: string }
        details: { type: object, additionalProperties: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
