# OSV-Scanner exclusions. Every entry must name the finding and explain why it
# is not exploitable here, never just "ignore" (CONTRIBUTING.md). Reviewed
# whenever `make vuln` / CI's security job flags something new.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = """
Blanket advisory: golang.org/x/crypto/openpgp is unmaintained/unsafe by
design, with no fixed version (applies to every x/crypto release). OpsGrid
never imports openpgp. x/crypto is pulled in solely via
testcontainers-go -> golang.org/x/crypto/ssh, used only by
internal/platform/database/dbtest (the `integration` build tag, test-only,
never compiled into a shipped binary). Re-check when testcontainers-go
drops the ssh dependency or the advisory gains a fixed version.
"""
