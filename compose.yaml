# OpsGrid local environment (ADR-010).
#
#   docker compose up -d                              core: postgres, redis, keycloak, storage (Garage), migrate, api, worker, relay, mailpit
#   docker compose --profile observability up -d      + otel-collector, prometheus, tempo, loki, grafana
#   docker compose --profile chaos up -d              + toxiproxy (failure injection)
#
# All credentials here are LOCAL DEVELOPMENT defaults (see .env.example).
# Ports bind to 127.0.0.1 only.

name: opsgrid

x-app-env: &app-env
  OPSGRID_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  REDIS_URL: redis://redis:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  PUBLIC_ORIGIN: http://localhost:5173
  HTTP_ADDR: ":8080"
  HTTP_INTERNAL_ADDR: ":9090"

x-app: &app
  image: opsgrid:dev
  build:
    context: .
    args:
      VERSION: ${OPSGRID_VERSION:-dev}
      COMMIT: ${GIT_COMMIT:-unknown}
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    migrate: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9090/readyz"]
    interval: 10s
    timeout: 4s
    start_period: 10s
    retries: 3

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsgrid-dev-superuser}
      OPSGRID_MIGRATOR_PASSWORD: ${OPSGRID_MIGRATOR_PASSWORD:-opsgrid-dev-migrator}
      OPSGRID_APP_PASSWORD: ${OPSGRID_APP_PASSWORD:-opsgrid-dev-app}
      OPSGRID_WORKER_PASSWORD: ${OPSGRID_WORKER_PASSWORD:-opsgrid-dev-worker}
      OPSGRID_RELAY_PASSWORD: ${OPSGRID_RELAY_PASSWORD:-opsgrid-dev-relay}
      OPSGRID_REPORTING_RO_PASSWORD: ${OPSGRID_REPORTING_RO_PASSWORD:-opsgrid-dev-reporting}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_lock_waits=on
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/bootstrap:/opsgrid-bootstrap:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsgrid"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  redis:
    image: redis:8.10.0-alpine
    # AOF persistence: streams must survive a Redis restart (ADR-008).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-opsgrid-dev-admin}
      KC_HTTP_PORT: "8080"
      # Browsers reach Keycloak on localhost:8180; the API reaches it on
      # keycloak:8080. A fixed frontend hostname keeps the token issuer stable
      # while back-channel calls use the internal address.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -Xms128m -Xmx512m"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8180:8080"]
    mem_limit: 768m
    healthcheck:
      # The image has no curl; probe the management port with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  migrate:
    <<: *app
    command: ["/usr/local/bin/migrate", "up"]
    entrypoint: []
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATOR_DATABASE_URL: postgres://opsgrid_migrator:${OPSGRID_MIGRATOR_PASSWORD:-opsgrid-dev-migrator}@postgres:5432/opsgrid?sslmode=disable
      LOG_FORMAT: json
    healthcheck:
      disable: true

  api:
    <<: *app
    command: ["/usr/local/bin/api"]
    entrypoint: []
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: opsgrid-api
      DATABASE_URL: postgres://opsgrid_app:${OPSGRID_APP_PASSWORD:-opsgrid-dev-app}@postgres:5432/opsgrid?sslmode=disable
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9090:9090"]

  worker:
    <<: *app
    command: ["/usr/local/bin/worker"]
    entrypoint: []
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: opsgrid-worker
      DATABASE_URL: postgres://opsgrid_worker:${OPSGRID_WORKER_PASSWORD:-opsgrid-dev-worker}@postgres:5432/opsgrid?sslmode=disable
      DATABASE_MAX_CONNS: "10"

  relay:
    <<: *app
    command: ["/usr/local/bin/relay"]
    entrypoint: []
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: opsgrid-relay
      DATABASE_URL: postgres://opsgrid_relay:${OPSGRID_RELAY_PASSWORD:-opsgrid-dev-relay}@postgres:5432/opsgrid?sslmode=disable
      DATABASE_MAX_CONNS: "4"

  # Local S3-compatible object storage (ADR-017). R2 in the public demo.
  storage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-opsgrid-dev-garage-admin}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - storagedata:/var/lib/garage
    ports: ["127.0.0.1:3900:3900"]

  storage-init:
    image: curlimages/curl:8.22.0
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-opsgrid-dev-garage-admin}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK0b5f3a91c2d4e6f8a0b1c2d3}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-opsgridDevSecret00000000000000000000000000000000000000000000000}
      S3_BUCKET: opsgrid
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes: [./infra/garage/init.sh:/init.sh:ro]
    depends_on: [storage]

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  # ---- observability profile ----------------------------------------------------

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [tempo, loki]
    mem_limit: 256m

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9091:9090"]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo

  loki:
    profiles: [observability]
    image: grafana/loki:3.6
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo, loki]

  # ---- chaos profile ----------------------------------------------------------------

  toxiproxy:
    profiles: [chaos]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: [./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro]
    ports: ["127.0.0.1:8474:8474"]

volumes:
  pgdata:
  storagedata:
  redisdata:
  promdata:
  tempodata:
  lokidata:
